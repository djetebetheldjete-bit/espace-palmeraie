      if(it.id==="vins"){var ta=h("textarea",{id:"vin-list",rows:"4",placeholder:"Un nom de vin par ligne"});ta.value=it.vins||"";ta.addEventListener("input",function(){it.vins=ta.value;sync()});menu.appendChild(h("label",{for:"vin-list",text:"Vins en stock (un nom par ligne)"}));menu.appendChild(ta)}})});

    var sel=h("select",{"aria-label":"État "+o[0]});sel.innerHTML=opts(OS,o[2]);

function openTab(id){

async function publish(){
  if(!SB){toast("Base de données indisponible.");return}
  if(!isEditor){toast("Connectez-vous pour publier.");return}
  if(!dirty())return;
  busy=true;updateBar();
  try{
    var payload={data:draft,updated_at:new Date().toISOString()};
    if(session&&session.user)payload.updated_by=session.user.id;
    var r=await SB.from("site_config").update(payload).eq("id",1).select("id");
    if(r.error)throw r.error;
    if(!r.data||!r.data.length)throw new Error("Modification refusée (droits).");
    state=clone(draft);renderSite();busy=false;updateBar();toast("Site mis à jour ✅");
  }catch(err){
    busy=false;updateBar();
    toast("Échec de la publication : "+((err&&err.message)||"réessayez."));
  }

function trad(err){
  var m=(err&&err.message)||"Erreur.";
  if(/Invalid login/i.test(m))return"E-mail ou mot de passe incorrect.";
  if(/Email not confirmed/i.test(m))return"E-mail pas encore confirmé : ouvrez l’e-mail de confirmation, puis réessayez.";
  if(/already registered|already been registered/i.test(m))return"Ce compte existe déjà : utilisez « Se connecter ».";
  if(/at least 6|password should be/i.test(m))return"Mot de passe d’au moins 6 caractères.";
  return m;
}
async function checkRole(){
  try{var r=await SB.from("admins").select("role").maybeSingle();
    if(r&&r.data){isMaint=(r.data.role==="maintenancier");return true}
    isMaint=false;return false;
  }catch(e){isMaint=false;return false}
}
async function showSlots(){

  try{var r=await SB.rpc("gerant_slots_left");
    var el=$("loginhint");
    if(el&&r&&typeof r.data==="number")el.textContent="Places de gérant : "+(4-r.data)+" / 4 occupées ("+r.data+" restante"+(r.data>1?"s":"")+").";
  }catch(e){}
}
function updateMaintUI(){

async function renderGerants(){

  var list=$("glist"),slots=$("gslots");if(!list)return;
  list.textContent="Chargement…";

    var a=await SB.from("admins").select("user_id,email,role");

    var admins=(a.data||[]).filter(function(x){return x.role==="gerant"});
    var allowed=(al.data||[]).filter(function(x){return x.role==="gerant"});
    if(slots)slots.textContent="Gérants inscrits : "+admins.length+" / 4 — autorisations utilisées : "+allowed.length+" / 4.";
    var signed={};admins.forEach(function(x){signed[(x.email||"").toLowerCase()]=x});
    list.textContent="";

      list.appendChild(h("div",{class:"row"},[h("span",null,[h("b",{text:em}),h("br"),h("span",{class:"note",text:a2?"compte créé — peut modifier le site":"en attente : doit créer son accès"})]),btn]));
    });
  }catch(err){list.textContent="Erreur de chargement : "+((err&&err.message)||"")}
}
async function addGerant(){
  var w=function(m){var g=$("gwarn");if(g)g.textContent=m||""};
  if(!SB||!isMaint){w("Action réservée au maintenancier.");return}
  var em=(($("gemail").value)||"").trim().toLowerCase();
  if(!em||em.indexOf("@")<1){w("Entrez une adresse e-mail valide.");return}
  w("Ajout…");
  var r=await SB.from("allowed_admin_emails").insert({email:em,role:"gerant"});
  if(r.error){var m=r.error.message||"";
    w(/duplicate|unique/i.test(m)?"Cette adresse est déjà autorisée.":/4 gérants|maximum/i.test(m)?"Déjà 4 gérants autorisés (maximum atteint).":m);return}

async function removeGerant(email,user_id){

async function refreshAuth(){

  var bl=$("btnlogin");if(bl)bl.addEventListener("click",async function(){
    if(!SB){warn("Base indisponible.");return}

    if(r.error){warn(trad(r.error));return}

async function boot(){
